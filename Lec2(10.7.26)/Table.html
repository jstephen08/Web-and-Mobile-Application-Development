<html>
    <head>
        <title>Tables and Forms</title>
        <style>
           table,th,td{
            border:2px solid blue ;
            border-collapse: collapse;
            color:brown;
            text-align: center;
            padding:5px;
           }
        </style>
    </head>

    <body>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Contact</th>
            </tr>
            <tr>
                <td>01</td>
                <td>Serah</td>
                <td>0766785344</td>
            </tr>
            <tr>
                <td>02</td>
                <td>Roshni</td>
                <td>0718602468</td>
            </tr>
        </table>
    </body>
</html>

<h2>Cell that spans two columns</h2>
<p>To make a cell span more than one column,
    use the colspan attribute.
</p>

<table>
    <tr>
        <th colspan="2">Name</th>
        <th>Age</th>
    </tr>
    <tr>
        <td rowspan="2">Jill</td>
        <td>Smith</td>
        <td>20</td>
    </tr>
    <tr>
        <td>Jackson</td>
        <td>35</td>
    </tr>
</table>
