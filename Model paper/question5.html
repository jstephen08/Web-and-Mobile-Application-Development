<html>
    <head>
        <title>Electrical Items Total Price Calculator</title>
    </head>
    <body>
        <h1>Electrical Items Total Price Calculator</h1>
        <script>
            function calculateTotalPrice(){
                var quantity=prompt("Enter the quantity of electrical items sold: ");
                var totalPrice=quantity*500;
                document.write("Price of each electrical item is $500 <br>");
                document.write("Total price for " + quantity + "items is $" +totalPrice+ ".");
            }
            calculateTotalPrice();
        </script>
    </body>
</html>
