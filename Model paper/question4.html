<html>
    <head>
    </head>
    <body>
        <script>
            let distance=prompt("Enter the number of kilometers you plan to travel: ");

            if (distance<=50){
                alert("The rental cost for the car is $30");
            } else if(distance>50 && distance <=150){
                alert("The rental cost for the car is $60");
            } else{
                alert("The rental cost for the car is $100");
            }
        </script>
    </body>
</html>
