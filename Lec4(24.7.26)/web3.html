<html>
    <head>
        <title>Webpage for js</title>
    </head>
    <body>
        <script>
            var name="Joannah";
            var university="NSBM";
            var age="20";
            var city="Wattala";
            document.write("My name is " + name + " and my university is " + university + ".")
            document.write(" I am " + age + " years old and I live in " + city + ".");
        </script>
        <br>
        <script>
            var initial_candies=10;
            var given_candies=5;
            var total_candies=initial_candies+given_candies;
            document.write("Total candies are: " + total_candies);
        </script>
        <br>
        <script>
            var storyprice="200";
            var writingprice="100";
            var number_story="40";
            var number_writing="20";

            var total_story=(storyprice*number_story);
            var total_writing=(writingprice*number_writing);
            var total=total_story+total_writing;

            document.write("<br>Total revenue from the sale of story books: Rs. "+total_story);
            document.write("<br>Total revenue from the sale of writing books: Rs. "+total_writing);
            document.write("<br>Total revenue from the sale of both story and writing books: Rs. "+total);
        </script>
    </body>
</html>
