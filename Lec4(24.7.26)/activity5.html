<html>
    <head>
        <title>Real Estate Application</title>
    </head>
    <body>
        <script>
            let area=parseFloat(prompt("Enter area of land "));
            if(area <=100){
                alert("The price of the land property is $10000");
            }
            else if(area <=200){
                alert("The price of the land property is $15000");
            }
            else{
                alert("The price of the land property is $20000");
            }
        </script>
    </body>
</html>
