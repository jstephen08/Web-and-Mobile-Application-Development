<html>
    <head>
        <title>Webpage with js</title>
    </head>
    <body>
        <script>
            var weight=prompt("Enter package weight ");
            if(weight <=5){
                alert("Shipping cost is $10");
            } 
            elseif(weight > 5 && weight <=10);{
                alert("Shipping cost is $15");
            }
            elseif(weight > 10);{
                alert("Shipping cost is $20");
            }
        </script>
    </body>
</html>
