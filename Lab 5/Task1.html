<body>

<h2>Find Square</h2>

<script>

function findSquare(num)
{
    return num * num;
}

let number = prompt("Enter a number:");

let answer = findSquare(Number(number));

document.write("Number : " + number + "<br>");
document.write("Square : " + answer);

</script>

</body>
