<html>
<head>
<title>Student Registration</title>
</head>

<body>

<h2>Student Registration Form</h2>

<form onsubmit="return validateForm()">

Student Name<br>
<input type="text" id="name"><br><br>

Age<br>
<input type="number" id="age"><br><br>

Email Address<br>
<input type="text" id="email"><br><br>

Password<br>
<input type="password" id="password"><br><br>

<input type="submit" value="Submit">

</form>

<p id="msg"></p>

<script>

function validateForm()
{
    let name=document.getElementById("name").value;
    let age=document.getElementById("age").value;
    let email=document.getElementById("email").value;
    let password=document.getElementById("password").value;

    if(name=="")
    {
        document.getElementById("msg").innerHTML="Student name cannot be empty";
        return false;
    }

    if(age<18)
    {
        document.getElementById("msg").innerHTML="Age must be 18 or above";
        return false;
    }

    if(email.indexOf("@")==-1 || email.indexOf(".")==-1)
    {
        document.getElementById("msg").innerHTML="Invalid Email";
        return false;
    }

    if(password.length<8)
    {
        document.getElementById("msg").innerHTML="Password must contain at least 8 characters";
        return false;
    }

    document.getElementById("msg").innerHTML="Registration Successful!";
    return false;
    
}

</script>

</body>
</html>
