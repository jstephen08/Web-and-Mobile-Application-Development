<html>
    <head>
        <title>Validation Form</title>
        <link rel="stylesheet" href="tute.style.css">
        <script>
            function validate(){
                if(document.val.name.value.length==0){
                    alert("Please enter Username!");
                }
                else if(isNaN(document.val.age.value)){
                    alert("Age must be a number!");
                }
                else if(document.val.email.value=="@"){
                    alert("Enter valid email");
                }
                else if(document.val.pw.value!=document.val.cpw.value){
                    alert("Password does not match, try again!");
                }
                else if(!document.val.check.checked){
                    alert("Checkbox must be checked");
                }
                else{
                    alert("Validation Successful!");
                }
            }    
        </script>
    </head>    
            
        
    

    <body>
        <h2>Student Registration</h2>
        <form name="val">
            <label>Student Name:</label>
            <input type="text" name="name"><br><br>

            <label>Email:</label>
            <input type="email" name="email"><br><br>

            <label>Age:</label>
            <input type="text" name="age"><br><br>

            <label>Password:</label>
            <input type="password" name="pw"><br><br>

            <label>Confirm Password:</label>
            <input type="password" name="cpw"><br><br>

            <input type="checkbox" name="check">I agree to the Terms and Conditions<br><br>

            <button type="button" value="Register" onclick="validate()">Register</button>
        </form>
    </body>
</html>
